<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>支出登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

<h1 th:text="${transaction.id}==null ? '支出登録' : '支出編集'"></h1>

<form th:action="${transaction.id} == null ? @{/transactions}
                 : @{/transactions/{id}(id=${transaction.id})}"
      th:object="${transaction}" method="post">

    <div>
        <label class="form-label fw-bold mt-3">金額</label>
        <input type="number" th:field="*{amount}" class="form-control">
        <span th:if="${#fields.hasErrors('amount')}"
              th:errors="*{amount}" class="text-danger"> </span>
        <!--#fieldsはThymeleafが要した検証へのアクセス手段-->
        <!--Entityに書いたエラー内容が出る-->
    </div>

    <div>
        <label class="form-label fw-bold">日時</label>
        <input type="datetime-local" th:field="*{date}" class="form-control">
        <span th:if="${#fields.hasErrors('date')}"
              th:errors="*{date}" class="text-danger"></span><!--Entityに書いたエラー内容が出る-->
    </div>

    <div>
        <label class="form-label fw-bold">種類</label>
        <select th:field="*{type}" class="form-select">
            <option value="expense">支出</option>
            <option value="income">収入</option>
        </select>
        <span th:if="${#fields.hasErrors('type')}"
              th:errors="*{type}" class="text-danger"></span><!--Entityに書いたエラー内容が出る-->
    </div>

    <div>
        <label class="form-label fw-bold">カテゴリ</label>
        <select th:field="*{category}" class="form-select">
            <option th:each="c:${categories}"
                    th:value="${c.id}"
                    th:text="${c.name}">
            </option>
        </select>
        <span th:if="${#fields.hasErrors('category')}"
              th:errors="*{category}" class="text-danger"></span><!--Entityに書いたエラー内容が出る-->
    </div>

    <div class="text-end mt-3">
        <a th:href="@{/transactions}" class="btn btn-secondary me-2">戻る</a>
        <input type="submit" class="btn btn-primary" th:value="${transaction.id}==null ? '登録' : '編集完了'">
    </div>

</form>
</div>
</body>
</html>
