<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>支出一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

 <h1>支出一覧</h1>
 <a th:href="@{/transactions/new}" class="btn btn-success mb-4">＋新規登録</a>

 <table class="table table-bordered table-striped">
    <tr>
        <th>日付</th>
        <th>金額</th>
        <th>種別</th>
        <th>カテゴリ</th>
        <th>操作</th>
    </tr>

    <tr th:each="t:${transactions}">
        <td th:text="${t.date}"></td>
        <td th:text="${t.amount}"></td>
        <td th:text="${t.type == 'expense'} ? '支出' : '収入'"></td>
        <td th:text="${t.category?.name}"></td>
        <td><form th:action="@{/transactions/{id}/delete(id=${t.id})}" method="post">
                <input type="submit" value="削除" class="btn btn-danger btn-sm">
        </form>
        </td>
        <td>
            <a th:href="@{/transactions/{id}/edit(id=${t.id})}" class="btn btn-primary btn-sm">編集</a>
        </td>
    </tr>
 </table>

    <div class="row g-0">
        <div class="col-4 border p-2 text-center" >収入合計:<span th:text="${income}"></span></div>
        <div class="col-4 border p-2 text-center">支出合計:<span th:text="${expense}"></span></div>
        <div class="col-4 border p-2 text-center">収支:<span th:text="${income-expense}"></span></div>
    </div>

</div>
</body>
</html>
